name: 功能建议
description: 提出新的功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 说明使用场景和期望的效果即可。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你希望解决什么问题，或什么场景下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改动
      description: 描述你期望的行为或界面变化。
    validations:
      required: true
