name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.0.9"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish gRAW release
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      ARTIFACT: gRAW-windows-x64-${{ github.event.inputs.version || github.ref_name }}.exe

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate third-party license data
        run: npm run licenses

      - name: Build portable executable
        run: npm run tauri build -- --no-bundle

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "artifacts"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $exe = "src-tauri/target/release/graw.exe"
          Copy-Item -LiteralPath $exe -Destination (Join-Path $staging $env:ARTIFACT)

          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $staging $env:ARTIFACT)).Hash.ToLower()
          $shaFile = Join-Path $staging "$env:ARTIFACT.sha256"
          [System.IO.File]::WriteAllText($shaFile, "$hash  $env:ARTIFACT`n")

          Get-ChildItem -LiteralPath $staging | Select-Object Name, Length
          Write-Output "ARTIFACTS_DIR=$staging" >> $env:GITHUB_ENV

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/gRAW-windows-x64-${{ env.VERSION }}.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: gRAW ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ env.ARTIFACTS_DIR }}/gRAW-windows-x64-${{ env.VERSION }}.exe
            ${{ env.ARTIFACTS_DIR }}/gRAW-windows-x64-${{ env.VERSION }}.exe.sha256
