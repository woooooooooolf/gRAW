name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.8.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish gRAW release
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      ARTIFACT: gRAW-windows-x64-${{ github.event.inputs.version || github.ref_name }}.exe

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Verify release version
        shell: pwsh
        run: |
          $expectedVersion = $env:VERSION -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $expectedVersion -or $tauriVersion -ne $expectedVersion) {
            throw "Release tag $env:VERSION does not match app versions: package=$packageVersion, tauri=$tauriVersion"
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate third-party license data
        run: npm run licenses

      - name: Build portable executable
        run: npm run tauri build -- --no-bundle

      - name: Test release CLI
        run: npm run test:cli

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "artifacts"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $exe = "src-tauri/target/release/graw.exe"
          Copy-Item -LiteralPath $exe -Destination (Join-Path $staging $env:ARTIFACT)

          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $staging $env:ARTIFACT)).Hash.ToLower()
          $shaFile = Join-Path $staging "$env:ARTIFACT.sha256"
          [System.IO.File]::WriteAllText($shaFile, "$hash  $env:ARTIFACT`n")

          Get-ChildItem -LiteralPath $staging | Select-Object Name, Length
          Write-Output "ARTIFACTS_DIR=$staging" >> $env:GITHUB_ENV

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/gRAW-windows-x64-${{ env.VERSION }}.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: gRAW ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ env.ARTIFACTS_DIR }}/gRAW-windows-x64-${{ env.VERSION }}.exe
            ${{ env.ARTIFACTS_DIR }}/gRAW-windows-x64-${{ env.VERSION }}.exe.sha256
